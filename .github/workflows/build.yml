name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Install all system dependencies required for python-for-android / Buildozer
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev install-info git zip unzip ocaml-nox \
        ccache automake autoconf libtool pkg-config zlib1g-dev libasound2-dev libssl-dev \
        cmake ant openssh-client libncurses5-dev libtinfo-dev libgmp-dev lld openjdk-17-jdk

    # 2. Set up a modern Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install Buildozer and Cython via pip directly
    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # 4. Create a clean date stamp for the cache key
    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT
      shell: bash

    # 5. Cache Buildozer global downloads
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    # 6. Cache project-specific build targets
    - name: Cache Buildozer local directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

    # 7. Run Buildozer directly without the broken third-party action wrapper
    - name: Build with Buildozer
      run: |
        buildozer android debug

    # 8. Upload the compiled APK artifact from the bin directory
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

